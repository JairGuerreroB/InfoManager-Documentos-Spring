# ---------------------------------------------------------------
# InfoManager System - Módulo de Documentos
# ---------------------------------------------------------------
spring.application.name=infomanager-documentos

# La contraseña de MySQL se lee de local.properties (archivo que no se sube a GitHub).
# Copie local.properties.example como local.properties y escriba su clave.
spring.config.import=optional:classpath:local.properties

# Conexión a MySQL (la misma base de las evidencias anteriores)
spring.datasource.url=jdbc:mysql://localhost:3306/infomanager_db?serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&sslMode=DISABLED
spring.datasource.username=root

# Hibernate: las tablas las crean los scripts de la carpeta database, Hibernate no las modifica
spring.jpa.hibernate.ddl-auto=none
# Evita abrir consultas fuera de los servicios (buena práctica con relaciones LAZY)
spring.jpa.open-in-view=false
# Muestra en la consola el SQL que genera Hibernate (útil para entender y probar)
spring.jpa.show-sql=true

# Archivos subidos: tamaño máximo y carpeta donde se guardan
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
infomanager.almacen.ruta=./almacen

# Días de antelación con los que un documento pasa a "por vencer"
infomanager.dias-aviso-vencimiento=30

server.port=8080
